<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuickQR</title>
<script>
// Apply saved theme before paint to avoid a flash
(function(){try{var t=localStorage.getItem('quickqr-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}})();
</script>
<style>
:root{
  --wall-1:#c9d6ff;--wall-2:#e2e2ff;--wall-3:#ffd6e8;
  --window:rgba(255,255,255,.72);--window-solid:#fbfbfd;
  --titlebar:rgba(246,246,248,.8);--sep:rgba(0,0,0,.1);
  --text:#1d1d1f;--muted:#6e6e73;--field:#fff;--field-border:rgba(0,0,0,.14);
  --accent:#0a84ff;--accent-press:#0070e0;--accent-ring:rgba(10,132,255,.35);
  --seg-bg:rgba(118,118,128,.12);--seg-on:#fff;--seg-shadow:0 1px 3px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.06);
  --btn2:rgba(118,118,128,.12);--btn2-hover:rgba(118,118,128,.2);
  --shadow:0 30px 80px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.18);
  --ok:#34c759;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wall-1:#1b2240;--wall-2:#2a1840;--wall-3:#0d2236;
  --window:rgba(40,40,44,.72);--window-solid:#1e1e20;
  --titlebar:rgba(52,52,56,.8);--sep:rgba(255,255,255,.1);
  --text:#f5f5f7;--muted:#98989d;--field:rgba(255,255,255,.06);--field-border:rgba(255,255,255,.14);
  --accent:#0a84ff;--accent-press:#3395ff;--accent-ring:rgba(10,132,255,.5);
  --seg-bg:rgba(118,118,128,.24);--seg-on:#636366;--seg-shadow:0 1px 3px rgba(0,0,0,.4);
  --btn2:rgba(118,118,128,.24);--btn2-hover:rgba(118,118,128,.34);
  --shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.12);
  --ok:#30d158;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --wall-1:#1b2240;--wall-2:#2a1840;--wall-3:#0d2236;
  --window:rgba(40,40,44,.72);--window-solid:#1e1e20;
  --titlebar:rgba(52,52,56,.8);--sep:rgba(255,255,255,.1);
  --text:#f5f5f7;--muted:#98989d;--field:rgba(255,255,255,.06);--field-border:rgba(255,255,255,.14);
  --accent:#0a84ff;--accent-press:#3395ff;--accent-ring:rgba(10,132,255,.5);
  --seg-bg:rgba(118,118,128,.24);--seg-on:#636366;--seg-shadow:0 1px 3px rgba(0,0,0,.4);
  --btn2:rgba(118,118,128,.24);--btn2-hover:rgba(118,118,128,.34);
  --shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.12);
  --ok:#30d158;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1200px 800px at 10% 10%,var(--wall-1),transparent 60%),
    radial-gradient(1000px 700px at 90% 20%,var(--wall-3),transparent 60%),
    radial-gradient(900px 900px at 50% 100%,var(--wall-2),transparent 60%),
    var(--window-solid);
  background-attachment:fixed;
  display:flex;align-items:flex-start;justify-content:center;
  padding:max(48px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));
  transition:background-color .3s;
}
.window{
  width:100%;max-width:460px;border-radius:14px;overflow:hidden;
  background:var(--window);
  -webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);
  box-shadow:var(--shadow);
  animation:pop .35s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.titlebar{
  height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 12px;background:var(--titlebar);border-bottom:.5px solid var(--sep);
  -webkit-user-select:none;user-select:none;
}
.lights{display:flex;gap:8px}
.lights span{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.lights span:nth-child(1){background:#ff5f57}
.lights span:nth-child(2){background:#febc2e}
.lights span:nth-child(3){background:#28c840}
.title{font-weight:600;font-size:13px;color:var(--text);opacity:.85}
.tb-right{justify-self:end}

/* Segmented control */
.seg{display:inline-flex;background:var(--seg-bg);border-radius:8px;padding:2px;gap:2px}
.seg button{
  border:0;background:transparent;color:var(--text);font:inherit;font-size:12px;font-weight:500;
  padding:4px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:5px;
  transition:background .15s,box-shadow .15s;
}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:var(--seg-shadow)}
.seg button:focus-visible{outline:2px solid var(--accent-ring);outline-offset:1px}
.seg.icons button{padding:4px 7px}
.seg svg{width:14px;height:14px;display:block}
.seg.wide{display:flex}
.seg.wide button{flex:1;justify-content:center;padding:6px 10px;font-size:13px}

.content{padding:24px 22px 22px}
.hero{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.app-icon{
  width:44px;height:44px;border-radius:11px;flex:none;
  background:linear-gradient(145deg,#5ac8fa,#0a84ff 55%,#5e5ce6);
  display:grid;place-items:center;box-shadow:0 4px 12px rgba(10,132,255,.35),inset 0 1px 0 rgba(255,255,255,.35);
}
.app-icon svg{width:26px;height:26px;color:#fff}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}

label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:0 0 6px 2px}
.field{position:relative}
input[type=text]{
  width:100%;padding:9px 12px;font:inherit;font-size:14px;color:var(--text);
  background:var(--field);border:.5px solid var(--field-border);border-radius:8px;
  box-shadow:inset 0 .5px 1px rgba(0,0,0,.06);transition:box-shadow .15s,border-color .15s;
}
input[type=text]::placeholder{color:var(--muted);opacity:.7}
input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-ring)}

.row{display:flex;gap:8px;margin-top:12px}
.btn{
  flex:1;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;border:0;border-radius:8px;cursor:pointer;
  background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15),inset 0 .5px 0 rgba(255,255,255,.25);
  transition:background .15s,transform .05s;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{background:var(--accent-press);transform:scale(.985)}
.btn.secondary{background:var(--btn2);color:var(--text);box-shadow:none}
.btn.secondary:hover{background:var(--btn2-hover);filter:none}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3.5px var(--accent-ring)}
.btn svg{width:15px;height:15px}

#out{margin-top:22px;display:none}
#out.show{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.preview{
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px;
  border-radius:12px;background:var(--seg-bg);
}
#cv{width:100%;max-width:240px;height:auto;border-radius:10px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.domain{font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.section{margin-top:16px}
.name-wrap{display:flex;align-items:center;gap:0}
.name-wrap input{border-top-right-radius:0;border-bottom-right-radius:0}
.ext{
  padding:9px 12px;font-size:14px;color:var(--muted);background:var(--seg-bg);
  border:.5px solid var(--field-border);border-left:0;border-radius:0 8px 8px 0;white-space:nowrap;
}

#msg{min-height:1.3em;margin-top:12px;font-size:12px;color:var(--muted);text-align:center;transition:color .2s}
#msg.ok{color:var(--ok)}
#hidden{position:absolute;left:-9999px;top:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="window" role="application" aria-label="QuickQR">
  <div class="titlebar">
    <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="title">QuickQR</div>
    <div class="tb-right">
      <div class="seg icons" id="theme" role="group" aria-label="Appearance">
        <button data-t="light" title="Light" aria-label="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button data-t="auto" title="Automatic" aria-label="Automatic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
        <button data-t="dark" title="Dark" aria-label="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
    </div>
  </div>

  <main class="content">
    <div class="hero">
      <div class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zm8-2h2v2h-2zm2 2h2v2h-2zm-2 2h2v2h-2zm4 0h2v2h-2zm2-4h2v2h-2zm0 4h2v4h-4v-2h2zm-4 2h2v2h-2z"/></svg></div>
      <div>
        <h1>QR Code Generator</h1>
        <p class="sub">Paste a link, get a QR code, download it.</p>
      </div>
    </div>

    <label for="url">Link or text</label>
    <div class="field"><input id="url" type="text" placeholder="https://example.com" autocomplete="off" inputmode="url" spellcheck="false"></div>
    <div class="row">
      <button id="gen" class="btn">Generate</button>
      <button id="clr" class="btn secondary">Clear</button>
    </div>

    <div id="out">
      <div class="preview">
        <canvas id="cv" width="560" height="560" aria-label="Generated QR code"></canvas>
        <div class="domain" id="domain"></div>
      </div>

      <div class="section">
        <label for="fname">File name</label>
        <div class="name-wrap">
          <input id="fname" type="text" autocomplete="off" spellcheck="false">
          <span class="ext" id="ext">.png</span>
        </div>
      </div>

      <div class="section">
        <label>Format</label>
        <div class="seg wide" id="fmt" role="group" aria-label="Format">
          <button data-f="png" aria-pressed="true">PNG</button>
          <button data-f="svg">SVG</button>
          <button data-f="pdf">PDF</button>
        </div>
      </div>

      <div class="row" style="margin-top:16px">
        <button id="dl" class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download</button>
        <button id="copy" class="btn secondary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>Copy image</button>
      </div>
    </div>

    <div id="msg" role="status" aria-live="polite"></div>
    <div id="hidden"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var input=$('url'),out=$('out'),cv=$('cv'),msg=$('msg'),hid=$('hidden'),fname=$('fname'),ext=$('ext'),domainEl=$('domain');
  var current='',modules=null,format='png',nameEdited=false;
  function say(t,ok){msg.textContent=t||'';msg.className=ok?'ok':''}

  /* ---------- Theme ---------- */
  var root=document.documentElement;
  function applyTheme(t){
    if(t==='light'||t==='dark')root.setAttribute('data-theme',t);else root.removeAttribute('data-theme');
    try{if(t==='auto')localStorage.removeItem('quickqr-theme');else localStorage.setItem('quickqr-theme',t)}catch(e){}
    [].forEach.call(document.querySelectorAll('#theme button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.t===t))});
  }
  applyTheme(root.getAttribute('data-theme')||'auto');
  $('theme').addEventListener('click',function(e){var b=e.target.closest('button');if(b)applyTheme(b.dataset.t)});

  /* ---------- Friendly file names ---------- */
  // Multi-part public suffixes so "bbc.co.uk" -> "bbc", not "co"
  var SLD=/^(co|com|net|org|gov|edu|ac|or|ne|go|mil|nic|ltd|plc)$/;
  function slug(s,max){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,max||40).replace(/-+$/,'')}
  function parseUrl(text){
    var t=text.trim();
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(t)){
      if(/^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/|$|\?|#|:)/i.test(t))t='https://'+t;else return null;
    }
    try{var u=new URL(t);return u.hostname?u:null}catch(e){return null}
  }
  function baseName(text){
    var u=parseUrl(text);
    if(u){
      var host=u.hostname.replace(/^www\d*\./i,'');
      if(/^\d+(\.\d+){3}$/.test(host)||host.indexOf(':')>-1)return slug(host)||'qr-code';
      var parts=host.split('.');
      var i=parts.length-2;
      if(i>0&&SLD.test(parts[i])&&parts[parts.length-1].length===2)i--;
      var name=parts[Math.max(i,0)];
      // keep a meaningful subdomain, e.g. docs.google.com -> google-docs
      var sub=parts.slice(0,Math.max(i,0)).filter(function(p){return !/^(m|www|web|app)$/i.test(p)}).join('-');
      var segs=u.pathname.split('/').filter(Boolean);
      var first=segs.length?slug(decodeURIComponent(segs[0]).replace(/\.[a-z0-9]{1,5}$/i,''),24):'';
      var out=name+(sub?'-'+sub:'')+(first?'-'+first:'');
      return slug(out,50)||'qr-code';
    }
    if(/^mailto:/i.test(text))return 'email-'+slug(text.replace(/^mailto:/i,'').split('@')[0],30);
    if(/^tel:/i.test(text))return 'phone-'+slug(text.slice(4),20);
    if(/^WIFI:/i.test(text)){var m=text.match(/S:([^;]+)/i);return 'wifi-'+(m?slug(m[1],30):'network')}
    return slug(text.split(/\s+/).slice(0,5).join(' '),40)||'qr-code';
  }
  function displayDomain(text){var u=parseUrl(text);return u?u.hostname.replace(/^www\./,'')+(u.pathname!=='/'?u.pathname:''):text}
  function fileName(){
    var b=fname.value.trim().replace(/[\\\/:*?"<>|]+/g,'-').replace(/\.(png|svg|pdf)$/i,'')||'qr-code';
    return b+'.'+format;
  }

  /* ---------- Generate ---------- */
  function generate(){
    var text=input.value.trim();
    if(!text){say('Please paste a link first.');out.classList.remove('show');input.focus();return}
    if(typeof QRCode==='undefined'){say('QR library failed to load. Check your connection and reload.');return}
    hid.innerHTML='';
    try{
      var q=new QRCode(hid,{text:text,width:480,height:480,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
      modules=q._oQRCode;
    }catch(e){say('That text is too long for a QR code. Try a shorter link.');out.classList.remove('show');return}
    var src=hid.querySelector('canvas');
    var ctx=cv.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(src,40,40,480,480);
    if(text!==current||!nameEdited){fname.value=baseName(text)+'-qr';nameEdited=false}
    current=text;
    domainEl.textContent=displayDomain(text);domainEl.title=text;
    out.classList.add('show');say('');
  }

  function svgString(){
    var n=modules.getModuleCount(),cell=10,pad=4*cell,size=n*cell+pad*2,d='';
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(modules.isDark(r,c))d+='M'+(pad+c*cell)+' '+(pad+r*cell)+'h'+cell+'v'+cell+'h-'+cell+'z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
  }

  /* ---------- Save ---------- */
  function browserDownload(name,blob){
    var a=document.createElement('a'),url=URL.createObjectURL(blob);
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1500);
    say('Saved '+name,true);
  }
  async function save(name,blob){
    var dl=null;
    if(window.claude&&window.claude.use){try{dl=await window.claude.use('downloads')}catch(e){}}
    if(!dl){browserDownload(name,blob);return}
    try{await dl.save({filename:name,data:blob});say('Saved '+name,true)}
    catch(e){if(e&&e.code==='declined')say('Download cancelled.');else browserDownload(name,blob)}
  }

  function download(){
    if(!modules)return;
    var name=fileName();
    if(format==='png'){
      cv.toBlob(function(b){if(b)save(name,b);else say('Could not create the image.')},'image/png');
    }else if(format==='svg'){
      save(name,new Blob([svgString()],{type:'image/svg+xml'}));
    }else{
      if(!window.jspdf){say('PDF library failed to load. Reload the page and try again.');return}
      try{
        var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
        var w=doc.internal.pageSize.getWidth(),s=110;
        doc.addImage(cv.toDataURL('image/png'),'PNG',(w-s)/2,40,s,s);
        doc.setFontSize(11);
        doc.text(doc.splitTextToSize(current,w-40).slice(0,4),w/2,40+s+10,{align:'center'});
        save(name,doc.output('blob'));
      }catch(e){say('Could not create the PDF.')}
    }
  }

  async function copyImage(){
    if(!navigator.clipboard||!window.ClipboardItem){say('Copying images is not supported in this browser.');return}
    try{
      var blob=await new Promise(function(r){cv.toBlob(r,'image/png')});
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      say('QR code copied to clipboard',true);
    }catch(e){say('Could not copy the image.')}
  }

  /* ---------- Events ---------- */
  $('gen').addEventListener('click',generate);
  input.addEventListener('keydown',function(e){if(e.key==='Enter')generate()});
  $('clr').addEventListener('click',function(){input.value='';out.classList.remove('show');current='';modules=null;nameEdited=false;say('');input.focus()});
  fname.addEventListener('input',function(){nameEdited=true});
  fname.addEventListener('keydown',function(e){if(e.key==='Enter')download()});
  $('fmt').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    format=b.dataset.f;ext.textContent='.'+format;
    [].forEach.call(this.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',String(x===b))});
  });
  $('dl').addEventListener('click',download);
  $('copy').addEventListener('click',copyImage);
  input.focus();
})();
</script>
</body>
</html>
